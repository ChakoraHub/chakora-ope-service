name: Deploy Open Positions Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  enable-maintenance:
    name: Enable maintenance mode
    runs-on: ubuntu-latest
    steps:
      - name: Enable maintenance through FastAPI
        env:
          MAINTENANCE_ON_URL: ${{ secrets.OPE_MAINTENANCE_ON_URL || secrets.MAINTENANCE_ON_URL }}
          MAINTENANCE_TOKEN: ${{ secrets.MAINTENANCE_TOKEN }}
        run: |
          set -e
          echo "[maintenance:on] Starting maintenance enable request"
          if [ -z "$MAINTENANCE_ON_URL" ]; then
            echo "[maintenance:on] MAINTENANCE_ON_URL secret not set, skipping maintenance mode step."
            exit 0
          fi
          test -n "$MAINTENANCE_TOKEN" || { echo "Missing MAINTENANCE_TOKEN secret"; exit 1; }
          status=$(curl --silent --show-error --location --max-time 20 \
            --output maintenance-on-response.txt \
            --dump-header maintenance-on-headers.txt \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer $MAINTENANCE_TOKEN" \
            --request POST "$MAINTENANCE_ON_URL" || true)
          echo "[maintenance:on] HTTP status: $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "[maintenance:on] Request failed"
            exit 1
          fi
          echo "[maintenance:on] Maintenance enabled successfully"

  deploy:
    name: Deploy Open Positions Service to EC2
    runs-on: ubuntu-latest
    needs: enable-maintenance
    steps:
      - name: SSH and Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: |
            set -e
            cd "${{ secrets.APP_PATH }}"
            git fetch origin main
            git checkout -f -B main origin/main
            ./venv/bin/pip install -r requirements.txt
            pm2 restart "${{ secrets.PM2_SERVICE_NAME || 'ope-service' }}"
            echo "Deployment commands completed successfully."

  selenium-smoke-tests:
    name: Selenium Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-chromedriver: true

      - name: Install Selenium test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install selenium pytest

      - name: Wait for deployed Open Positions page
        env:
          CHAKORA_BASE_URL: https://chakorahub.com
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --max-time 10 "$CHAKORA_BASE_URL/apply" > /dev/null; then
              echo "Deployed website is responding."
              exit 0
            fi
            echo "Website not ready (attempt $attempt/12)."
            sleep 10
          done
          echo "Deployed website did not become ready."
          exit 1

      - name: Run Selenium smoke tests
        env:
          CHAKORA_BASE_URL: https://chakorahub.com
          EXPECT_MAINTENANCE_NOTICE: "false"
        run: |
          pytest -v smoke.py --junitxml=selenium-results.xml

      - name: Upload Selenium results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-results
          path: selenium-results.xml
          if-no-files-found: warn

  disable-maintenance:
    name: Disable maintenance after passing tests
    runs-on: ubuntu-latest
    needs: selenium-smoke-tests
    if: ${{ always() }}
    steps:
      - name: Disable maintenance through FastAPI
        env:
          MAINTENANCE_OFF_URL: ${{ secrets.OPE_MAINTENANCE_OFF_URL || secrets.MAINTENANCE_OFF_URL }}
          MAINTENANCE_TOKEN: ${{ secrets.MAINTENANCE_TOKEN }}
        run: |
          set -e
          echo "[maintenance:off] Starting maintenance disable request"
          if [ -z "$MAINTENANCE_OFF_URL" ]; then
            echo "[maintenance:off] MAINTENANCE_OFF_URL secret not set, skipping maintenance mode disable."
            exit 0
          fi
          test -n "$MAINTENANCE_TOKEN" || { echo "Missing MAINTENANCE_TOKEN secret"; exit 1; }
          status=$(curl --silent --show-error --location --max-time 20 \
            --output maintenance-off-response.txt \
            --dump-header maintenance-off-headers.txt \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer $MAINTENANCE_TOKEN" \
            --request POST "$MAINTENANCE_OFF_URL" || true)
          echo "[maintenance:off] HTTP status: $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "[maintenance:off] Request failed"
            exit 1
          fi
          echo "[maintenance:off] Maintenance disabled successfully"

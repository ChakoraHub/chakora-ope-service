apiVersion: apps/v1
kind: Deployment
metadata:
  name: chakora-ope-service
  namespace: chakorahub
  labels:
    app: chakora-ope-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chakora-ope-service
  template:
    metadata:
      labels:
        app: chakora-ope-service
    spec:
      containers:
      - name: ope-service
        image: ghcr.io/chakorahub/chakora-ope-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8500
          name: http
        env:
        - name: APP_TIMEZONE
          value: "Asia/Kolkata"
        - name: MAX_UPLOAD_QUESTIONS
          value: "50000"
        - name: MAX_ATTEMPTS_PER_TEST
          value: "3"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8500
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8500
          initialDelaySeconds: 10
          periodSeconds: 10

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chakora-ope-service
  namespace: argocd
  labels:
    app: chakora-ope-service
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ChakoraHub/chakora-ope-service.git
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: chakorahub
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
